name: Avantahost
options:
  bundleIdPrefix: de.avantahost
targets:
  Avantahost:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources: [Sources]
    dependencies:
      - target: AvantahostWidget
    entitlements:
      path: Config/Avantahost.entitlements
      properties:
        com.apple.security.application-groups: [group.de.avantahost.app]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.avantahost.app
        PRODUCT_NAME: Avantahost
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: Avantahost
        INFOPLIST_KEY_NSFaceIDUsageDescription: Avantahost nutzt Face ID, um die App zu entsperren.
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
  AvantahostWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - Widget
      - Sources/Core/ApiClient.swift
      - Sources/Core/ApiError.swift
      - Sources/Core/Keychain.swift
      - Sources/Core/SessionCookie.swift
      - Sources/Core/Flex.swift
      - Sources/Core/Models.swift
      - Sources/Core/ServerDetail.swift
      - Sources/Core/ServiceList.swift
      - Sources/Core/WidgetShare.swift
      - Sources/Design/Tokens.swift
    entitlements:
      path: Config/AvantahostWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.de.avantahost.app]
    info:
      path: Config/AvantahostWidget-Info.plist
      properties:
        CFBundleDisplayName: Avantahost
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.avantahost.app.widget
        PRODUCT_NAME: AvantahostWidget
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
